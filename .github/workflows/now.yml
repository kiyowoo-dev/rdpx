name: PC

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durasi sesi dalam menit (maks 350 = 5 jam 50 menit)"
        default: "350"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # batas maksimal runner GitHub-hosted (6 jam)

    steps:
      - name: Konfigurasi RDP dan user
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:RDP_PASSWORD)) {
            throw "Secret RDP_PASSWORD belum diisi (Settings > Secrets and variables > Actions)."
          }

          # Aktifkan RDP, NLA tetap ON
          $ts = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $ts -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "$ts\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1 -Force

          # Firewall: RDP hanya dari jaringan Tailscale
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue | Disable-NetFirewallRule
          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Action Allow `
            -Protocol TCP -LocalPort 3389 -RemoteAddress "100.64.0.0/10" -Profile Any | Out-Null

          Restart-Service -Name TermService -Force

          # Buat user RDP dengan password dari secret
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Instal Tailscale
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait
          Remove-Item $msi -Force
          Start-Sleep -Seconds 5

      - name: Hubungkan Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:TS_AUTHKEY)) {
            throw "Secret TAILSCALE_AUTH_KEY belum diisi."
          }
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tsExe up --authkey=$env:TS_AUTHKEY --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended

          $tsIP = $null
          for ($i = 0; $i -lt 12 -and -not $tsIP; $i++) {
            $tsIP = (& $tsExe ip -4 2>$null | Select-Object -First 1)
            if (-not $tsIP) { Start-Sleep -Seconds 5 }
          }
          if (-not $tsIP) { throw "IP Tailscale tidak ditetapkan." }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verifikasi RDP
        shell: pwsh
        run: |
          $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $r.TcpTestSucceeded) { throw "Port RDP 3389 tidak terjangkau." }
          Write-Host "RDP siap."

      - name: Pertahankan sesi
        shell: pwsh
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          $m = [Math]::Min([double]$env:MINUTES, 350)
          $end = (Get-Date).AddMinutes($m)

          Write-Host ""
          Write-Host "=== AKSES RDP ==="
          Write-Host "Alamat   : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Password : (isi secret RDP_PASSWORD)"
          Write-Host "Berakhir : $end"
          Write-Host "=================`n"

          while ((Get-Date) -lt $end) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP aktif. Batalkan lewat Actions > Cancel workflow."
            Start-Sleep -Seconds 300
          }
